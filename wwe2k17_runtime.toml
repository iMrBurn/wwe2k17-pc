# Runtime settings: copied next to the exe as wwe2k17.toml by tools\build.ps1, and built into the exes, which write
# them as wwe2k17.toml at the first start when the file is missing (the release zip does not ship it). The F4 menu's
# "Save to config" rewrites that file with every setting that differs from its default.

# Load the Xenos GPU emulation plugin (rexgpu-xenos.dll). Without it the stock SDK runs with no GPU
# at all: the kernel ignores the game's ring buffer setup and nothing is ever drawn.
gpu_plugin = "xenos"

# WWE 2K15 / 2K16 PC: D3D12 hung on these titles; use the Vulkan backend of the same plugin.
gpu_backend = "vulkan"
vulkan_device = -1
async_shader_compilation = true
gpu_vsync = false
